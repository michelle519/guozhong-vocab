<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>國中2000單 · Duolingo Style</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
  body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
  .card-flip { perspective: 1000px; }
  .card-inner { transition: transform 0.5s; transform-style: preserve-3d; }
  .card-flip.flipped .card-inner { transform: rotateY(180deg); }
  .card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .card-back { transform: rotateY(180deg); }
  .heart { transition: all 0.2s; }
  .heart.lost { opacity: 0.3; transform: scale(0.8); }
  .progress-bar { transition: width 0.3s ease; }
  .btn-press:active { transform: scale(0.96); }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .correct { background: #58cc02 !important; color: white !important; }
  .wrong { background: #ff4b4b !important; color: white !important; }
  .option:disabled { cursor: not-allowed; opacity: 0.85; }
</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
<div id="app" class="max-w-lg mx-auto min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🦉</span>
      <div>
        <div class="font-bold text-lg leading-tight">國中2000單</div>
        <div class="text-xs text-slate-500" id="header-sub">Unit 1 · People</div>
      </div>
    </div>
    <div class="flex items-center gap-3 text-sm">
      <div class="flex items-center gap-1" title="連續天數">
        <span>🔥</span><span id="streak" class="font-bold">0</span>
      </div>
      <div class="flex items-center gap-1" title="經驗值">
        <span>⭐</span><span id="xp" class="font-bold">0</span>
      </div>
      <div class="flex gap-0.5" id="hearts">
        <span class="heart text-red-500">❤️</span>
        <span class="heart text-red-500">❤️</span>
        <span class="heart text-red-500">❤️</span>
        <span class="heart text-red-500">❤️</span>
        <span class="heart text-red-500">❤️</span>
      </div>
    </div>
  </header>

  <!-- Main screens -->
  <main class="flex-1 p-4" id="main">
    <!-- Home -->
    <section id="screen-home" class="fade-in space-y-4">
      <div class="bg-gradient-to-br from-green-400 to-emerald-600 rounded-2xl p-5 text-white shadow-lg">
        <div class="text-sm opacity-90">今日目標</div>
        <div class="text-2xl font-bold mt-1">練習 10 個單字</div>
        <div class="mt-3 h-2 bg-white/30 rounded-full overflow-hidden">
          <div id="daily-progress" class="h-full bg-white progress-bar" style="width:0%"></div>
        </div>
        <div class="text-xs mt-1 opacity-90"><span id="daily-count">0</span> / 10</div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="startMode('flash')" class="btn-press bg-white rounded-xl p-4 shadow border border-slate-100 text-left hover:border-green-400 transition">
          <div class="text-2xl">📇</div>
          <div class="font-bold mt-1">單字卡</div>
          <div class="text-xs text-slate-500">翻卡記憶</div>
        </button>
        <button onclick="startMode('choice')" class="btn-press bg-white rounded-xl p-4 shadow border border-slate-100 text-left hover:border-green-400 transition">
          <div class="text-2xl">✅</div>
          <div class="font-bold mt-1">選擇題</div>
          <div class="text-xs text-slate-500">四選一</div>
        </button>
        <button onclick="startMode('spell')" class="btn-press bg-white rounded-xl p-4 shadow border border-slate-100 text-left hover:border-green-400 transition">
          <div class="text-2xl">⌨️</div>
          <div class="font-bold mt-1">拼寫</div>
          <div class="text-xs text-slate-500">看中文寫英文</div>
        </button>
        <button onclick="startMode('listen')" class="btn-press bg-white rounded-xl p-4 shadow border border-slate-100 text-left hover:border-green-400 transition">
          <div class="text-2xl">🎧</div>
          <div class="font-bold mt-1">聽力</div>
          <div class="text-xs text-slate-500">聽發音選答案</div>
        </button>
      </div>

      <div class="bg-white rounded-xl p-4 shadow border border-slate-100 space-y-3">
        <div class="font-bold text-sm text-slate-600">單元選擇</div>
        <div id="unit-list" class="space-y-2"></div>
        <div class="flex gap-2 pt-1">
          <button onclick="setLevel('1200')" id="btn-1200" class="flex-1 py-2 rounded-lg text-sm font-medium border-2 border-green-500 bg-green-50 text-green-700">1200字</button>
          <button onclick="setLevel('2000')" id="btn-2000" class="flex-1 py-2 rounded-lg text-sm font-medium border border-slate-200 text-slate-600">2000字</button>
          <button onclick="setLevel('all')" id="btn-all" class="flex-1 py-2 rounded-lg text-sm font-medium border border-slate-200 text-slate-600">全部</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <button onclick="showMistakes()" class="btn-press bg-white rounded-xl p-4 shadow border border-slate-100 text-left hover:border-orange-400 transition">
          <div class="text-2xl">📕</div>
          <div class="font-bold mt-1">錯題本</div>
          <div class="text-xs text-slate-500"><span id="mistake-count">0</span> 題待複習</div>
        </button>
        <button onclick="showStats()" class="btn-press bg-white rounded-xl p-4 shadow border border-slate-100 text-left hover:border-blue-400 transition">
          <div class="text-2xl">📊</div>
          <div class="font-bold mt-1">進度</div>
          <div class="text-xs text-slate-500">學習統計</div>
        </button>
      </div>
    </section>

    <!-- Practice screen -->
    <section id="screen-practice" class="hidden fade-in">
      <div class="flex items-center justify-between mb-4">
        <button onclick="goHome()" class="text-slate-500 text-sm">← 返回</button>
        <div class="text-sm font-medium" id="practice-title">練習中</div>
        <div class="text-sm text-slate-500"><span id="q-num">1</span>/<span id="q-total">10</span></div>
      </div>
      <div class="h-1.5 bg-slate-200 rounded-full mb-6 overflow-hidden">
        <div id="q-progress" class="h-full bg-green-500 progress-bar" style="width:10%"></div>
      </div>
      <div id="practice-area"></div>
    </section>

    <!-- Mistakes -->
    <section id="screen-mistakes" class="hidden fade-in space-y-3">
      <div class="flex items-center justify-between">
        <button onclick="goHome()" class="text-slate-500 text-sm">← 返回</button>
        <div class="font-bold">錯題本</div>
        <button onclick="clearMistakes()" class="text-xs text-red-500">清空</button>
      </div>
      <div id="mistakes-list" class="space-y-2"></div>
      <button onclick="startMode('mistake')" id="btn-review-mistakes" class="w-full py-3 bg-orange-500 text-white rounded-xl font-bold hidden">開始複習錯題</button>
    </section>

    <!-- Stats -->
    <section id="screen-stats" class="hidden fade-in space-y-4">
      <div class="flex items-center justify-between">
        <button onclick="goHome()" class="text-slate-500 text-sm">← 返回</button>
        <div class="font-bold">學習進度</div>
        <div></div>
      </div>
      <div id="stats-content" class="space-y-3"></div>
    </section>
  </main>

  <!-- Feedback toast -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-sm opacity-0 transition-opacity pointer-events-none z-50"></div>
</div>

<script>

// ========== STATE ==========
let state = {
  unit: 1,
  level: '1200',
  xp: 0,
  streak: 0,
  hearts: 5,
  daily: 0,
  mistakes: [],
  learned: {},
  lastDate: null
};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('guozhong_vocab_v2') || '{}');
    Object.assign(state, s);
    const today = new Date().toDateString();
    if (state.lastDate !== today) {
      if (state.lastDate) {
        const diff = (new Date(today) - new Date(state.lastDate)) / 86400000;
        if (diff > 1) state.streak = 0;
      }
      state.daily = 0;
      state.lastDate = today;
    }
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('guozhong_vocab_v2', JSON.stringify(state));
}

function getWords() {
  const u = UNITS.find(x => x.id === state.unit);
  if (!u) return [];
  if (state.level === '1200') return u.words_1200.map(w => ({...w, unit: u.id}));
  if (state.level === '2000') return u.words_2000.map(w => ({...w, unit: u.id}));
  return [...u.words_1200, ...u.words_2000].map(w => ({...w, unit: u.id}));
}

// ========== SPEECH ==========
function speak(text, rate = 0.9) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate;
  const voices = speechSynthesis.getVoices();
  const en = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) || voices.find(v => v.lang.startsWith('en'));
  if (en) u.voice = en;
  speechSynthesis.speak(u);
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

// ========== UI ==========
function updateHeader() {
  document.getElementById('streak').textContent = state.streak;
  document.getElementById('xp').textContent = state.xp;
  const hearts = document.getElementById('hearts');
  hearts.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'heart text-red-500' + (i >= state.hearts ? ' lost' : '');
    s.textContent = '❤️';
    hearts.appendChild(s);
  }
  document.getElementById('daily-count').textContent = state.daily;
  document.getElementById('daily-progress').style.width = Math.min(100, state.daily * 10) + '%';
  document.getElementById('mistake-count').textContent = state.mistakes.length;
  const u = UNITS.find(x => x.id === state.unit);
  document.getElementById('header-sub').textContent = u ? `Unit ${u.id} · ${u.titleZh}` : '';
}

function renderUnits() {
  const list = document.getElementById('unit-list');
  list.innerHTML = UNITS.map(u => {
    const total = u.words_1200.length + u.words_2000.length;
    const active = state.unit === u.id;
    return `<button onclick="selectUnit(${u.id})" class="w-full text-left px-3 py-2.5 rounded-lg border ${active ? 'border-green-500 bg-green-50' : 'border-slate-200'} flex justify-between items-center">
      <div><span class="font-medium">Unit ${u.id}</span> <span class="text-slate-600">${u.titleZh}</span></div>
      <span class="text-xs text-slate-400">${total}字</span>
    </button>`;
  }).join('');
}

function selectUnit(id) {
  state.unit = id;
  saveState();
  updateHeader();
  renderUnits();
}

function setLevel(lv) {
  state.level = lv;
  saveState();
  ['1200','2000','all'].forEach(l => {
    const b = document.getElementById('btn-' + l);
    if (l === lv) {
      b.className = 'flex-1 py-2 rounded-lg text-sm font-medium border-2 border-green-500 bg-green-50 text-green-700';
    } else {
      b.className = 'flex-1 py-2 rounded-lg text-sm font-medium border border-slate-200 text-slate-600';
    }
  });
}

function showScreen(name) {
  ['home','practice','mistakes','stats'].forEach(s => {
    document.getElementById('screen-' + s).classList.toggle('hidden', s !== name);
  });
}

function goHome() {
  showScreen('home');
  updateHeader();
  renderUnits();
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  setTimeout(() => t.style.opacity = '0', 1800);
}

// ========== PRACTICE ==========
let queue = { mode: null, queue: [], idx: 0, flipped: false };

function startMode(mode) {
  let words = mode === 'mistake' ? state.mistakes.map(m => m) : getWords();
  if (!words.length) { toast('沒有單字可練習'); return; }
  words = shuffle([...words]).slice(0, Math.min(10, words.length));
  queue = { mode, queue, idx: 0, flipped: false };
  showScreen('practice');
  document.getElementById('practice-title').textContent = {flash:'單字卡',choice:'選擇題',spell:'拼寫',listen:'聽力',mistake:'錯題複習'}[mode] || '練習';
  document.getElementById('q-total').textContent = words.length;
  renderQuestion();
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function flipCard() {
  queue.flipped = !queue.flipped;
  document.getElementById('fc')?.classList.toggle('flipped', queue.flipped);
}

function makeOptions(correct, asObj) {
  const pool = getWords().filter(w => w.en !== correct.en);
  const picks = shuffle(pool).slice(0, 3);
  const all = shuffle([correct, ...picks]);
  return asObj ? all : all.map(w => w.zh);
}

function checkChoice(btn, chosen, answer, isEn) {
  document.querySelectorAll('.option').forEach(b => b.disabled = true);
  const ok = chosen === answer;
  btn.classList.add(ok ? 'correct' : 'wrong');
  if (!ok) {
    document.querySelectorAll('.option').forEach(b => {
      if ((isEn ? b.textContent.startsWith(answer) : b.textContent === answer)) b.classList.add('correct');
    });
    addMistake(queue.queue[queue.idx]);
    loseHeart();
  } else {
    gainXP(10);
  }
  setTimeout(() => nextQ(), 900);
}

function checkSpell() {
  const input = document.getElementById('spell-input');
  const w = queue.queue[queue.idx];
  const ans = (input.value || '').trim().toLowerCase();
  const ok = ans === w.en.toLowerCase();
  if (ok) {
    input.classList.add('border-green-500');
    gainXP(15);
  } else {
    input.classList.add('border-red-500');
    toast('正確：' + w.en);
    addMistake(w);
    loseHeart();
  }
  setTimeout(() => nextQ(), 1000);
}

function hintSpell() {
  const w = queue.queue[queue.idx];
  const input = document.getElementById('spell-input');
  if (!input.value) input.value = w.en[0];
  else if (input.value.length < w.en.length) input.value = w.en.slice(0, input.value.length + 1);
}

function markKnown(known) {
  const w = queue.queue[queue.idx];
  if (known) {
    gainXP(8);
    state.learned[w.en] = (state.learned[w.en] || 0) + 1;
  } else {
    addMistake(w);
  }
  saveState();
  nextQ();
}

function nextQ() {
  queue.idx++;
  if (queue.idx >= queue.queue.length) finishSession();
  else renderQuestion();
}

function finishSession() {
  state.daily += queue.queue.length;
  if (state.daily >= 10 && state.streak === 0 || state.daily >= 10) {
    // streak handled on date change mostly
  }
  const today = new Date().toDateString();
  if (state.lastDate === today && state.daily >= 10) {
    // already counted
  }
  saveState();
  toast('完成！+' + (queue.queue.length * 8) + ' XP');
  goHome();
}

function gainXP(n) {
  state.xp += n;
  state.daily = Math.min(state.daily + 1, 99);
  const today = new Date().toDateString();
  if (!state.lastDate || state.lastDate !== today) {
    state.streak = (state.lastDate && ((new Date(today) - new Date(state.lastDate)) / 86400000) === 1) ? state.streak + 1 : 1;
    state.lastDate = today;
  }
  saveState();
  updateHeader();
}

function loseHeart() {
  if (state.hearts > 0) {
    state.hearts--;
    saveState();
    updateHeader();
  }
  if (state.hearts <= 0) {
    toast('生命用完了！休息一下再來');
    setTimeout(() => { state.hearts = 5; saveState(); goHome(); }, 1500);
  }
}

function addMistake(w) {
  if (!state.mistakes.find(m => m.en === w.en)) {
    state.mistakes.push({en: w.en, zh: w.zh, pos: w.pos, phonetic: w.phonetic, example: w.example});
    saveState();
  }
}

function showMistakes() {
  showScreen('mistakes');
  const list = document.getElementById('mistakes-list');
  if (!state.mistakes.length) {
    list.innerHTML = '<div class="text-center text-slate-400 py-8">目前沒有錯題 🎉</div>';
    document.getElementById('btn-review-mistakes').classList.add('hidden');
    return;
  }
  document.getElementById('btn-review-mistakes').classList.remove('hidden');
  list.innerHTML = state.mistakes.map(m => `
    <div class="bg-white rounded-xl p-3 border border-slate-100 flex justify-between items-center">
      <div>
        <div class="font-bold">${m.en}</div>
        <div class="text-sm text-slate-500">${m.zh}</div>
      </div>
      <div class="flex gap-1">
        <button onclick="speak('${m.en.replace(/'/g,"\\'")}',0.9)" class="text-sm px-2">🔊</button>
        <button onclick="speak('${m.en.replace(/'/g,"\\'")}',0.55)" class="text-sm px-2">🐢</button>
      </div>
    </div>`).join('');
}

function clearMistakes() {
  if (confirm('確定清空錯題本？')) {
    state.mistakes = [];
    saveState();
    showMistakes();
    updateHeader();
  }
}

function showStats() {
  showScreen('stats');
  const learned = Object.keys(state.learned).length;
  const total = UNITS.reduce((s,u) => s + u.words_1200.length + u.words_2000.length, 0);
  document.getElementById('stats-content').innerHTML = `
    <div class="bg-white rounded-xl p-4 border border-slate-100 grid grid-cols-2 gap-4 text-center">
      <div><div class="text-2xl font-bold text-green-600">${state.xp}</div><div class="text-xs text-slate-500">總 XP</div></div>
      <div><div class="text-2xl font-bold text-orange-500">${state.streak}</div><div class="text-xs text-slate-500">連續天數</div></div>
      <div><div class="text-2xl font-bold text-blue-500">${learned}</div><div class="text-xs text-slate-500">已練習單字</div></div>
      <div><div class="text-2xl font-bold text-slate-600">${total}</div><div class="text-xs text-slate-500">目前總單字</div></div>
    </div>
    <div class="bg-white rounded-xl p-4 border border-slate-100">
      <div class="font-bold mb-2 text-sm">各單元單字數</div>
      ${UNITS.map(u => `<div class="flex justify-between text-sm py-1"><span>Unit ${u.id} ${u.titleZh}</span><span class="text-slate-500">${u.words_1200.length + u.words_2000.length}</span></div>`).join('')}
    </div>`;
}

// init
loadState();
updateHeader();
renderUnits();
setLevel(state.level || '1200');
</script>
</body>
</html>
